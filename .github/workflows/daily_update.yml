name: Otomatik Günlük M3U Güncelleyici

on:
  schedule:
    # Her gün Türkiye saatiyle gece 03:00'te (UTC 00:00) otomatik çalışır
    - cron: '0 0 * * *'
  workflow_dispatch: # İsterseniz GitHub panelinden elle de başlatabilirsiniz

jobs:
  update-links:
    runs-on: ubuntu-latest

    steps:
    # 1. Depodaki dosyaları çek
    - name: Repo Kodlarını Getir
      uses: actions/checkout@v3

    # 2. Python Kurulumu
    - name: Python Kur
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Gelişmiş Cloudflare Bypass kütüphanesini yükle
    - name: Gerekli Kütüphaneleri Yükle
      run: |
        python -m pip install --upgrade pip
        pip install curl_cffi

    # 4. Scripti Çalıştır ve M3U'ları Güncelle
    - name: Güncelleme Scriptini Çalıştır
      run: python update.py

    # 5. Güncellenen M3U dosyalarını GitHub'a geri yükle (Push et)
    - name: Değişiklikleri GitHub'a Kaydet
      run: |
        git config --local user.email "actions@github.com"
        git config --local user.name "GitHub Actions"
        git add *.m3u
        # Eğer değişiklik yoksa hata vermemesi için "or true" ekledik
        git commit -m "Günlük Otomatik M3U Güncellemesi [skip ci]" || true
        git push
