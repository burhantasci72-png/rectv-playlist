name: RecTV M3U Guncelleyici

on:
  schedule:
    - cron: '0 */3 * * *' 
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python Betiğini Çalıştır (Listeleri Oluştur)
        run: python main.py

      - name: Değişiklikleri Kaydet ve GitHub'a Yükle
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          # Sadece tek dosya değil, oluşan TÜM m3u dosyalarını ekle:
          git add *.m3u
          git commit -m "M3U Listeleri Otomatik Güncellendi[skip ci]" || echo "Değişiklik yok"
          git push
