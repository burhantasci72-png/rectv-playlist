name: RecTV M3U Guncelleyici

# Bot ne zaman çalışsın?
on:
  schedule:
    - cron: '0 */3 * * *' # Her 3 saatte bir otomatik çalışır. (Zamanı değiştirebilirsiniz)
  workflow_dispatch: # Bu sayede GitHub üzerinden butona basarak manuel de çalıştırabilirsiniz.

# Bota dosyayı depoya kaydetme yetkisi veriyoruz
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Depoyu Çek
        uses: actions/checkout@v4

      - name: Python Kurulumu
        uses: actions/setup-python@v4
        with:
          python-version: '3.x'

      - name: Gerekli Kütüphaneleri Yükle
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Python Betiğini Çalıştır (M3U Oluştur)
        run: python main.py

      - name: Değişiklikleri Kaydet ve GitHub'a Yükle (Push)
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add playlist.m3u
          # Eğer dosyada değişiklik yoksa hata vermemesi için:
          git commit -m "M3U Listesi Otomatik Güncellendi [skip ci]" || echo "Değişiklik yok"
          git push
